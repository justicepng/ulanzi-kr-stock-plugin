<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>국내/해외 주식·매크로 설정</title>
  <style>
    :root {
      --bg: #1e1e24;
      --panel: #2a2a32;
      --border: #3a3a46;
      --text: #e6e6eb;
      --muted: #9898a6;
      --accent: #03c75a;
      --accent-hover: #02b350;
      --input-bg: #16161b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px 14px;
      background-color: var(--bg);
      color: var(--text);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      font-size: 12px;
      line-height: 1.4;
    }
    .sdpi-wrapper { display: flex; flex-direction: column; gap: 10px; }
    .sdpi-heading {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: 0.5px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }
    .sdpi-item { display: flex; align-items: center; gap: 8px; min-height: 28px; }
    .sdpi-item-label { width: 82px; flex-shrink: 0; text-align: right; color: var(--muted); font-size: 11.5px; }
    .sdpi-item-value { flex: 1; display: flex; gap: 6px; min-width: 0; }
    input[type="text"], select {
      width: 100%;
      height: 28px;
      padding: 0 8px;
      background: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }
    input[type="text"]:focus, select:focus { border-color: var(--accent); }
    button {
      height: 28px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--panel);
      color: var(--text);
      font-size: 11.5px;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: #353540; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button.primary:hover { background: var(--accent-hover); }
    .actions-row { display: flex; gap: 8px; margin-left: 90px; margin-top: 4px; }
    .actions-row button { flex: 1; }
    .status-text { margin-left: 90px; font-size: 11px; color: var(--muted); min-height: 16px; }
    .status-text.error { color: #f87171; }
    .status-text.ok { color: #34d399; }
    .checkbox-wrap { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; }
    .checkbox-wrap input { accent-color: var(--accent); cursor: pointer; }
  </style>
</head>
<body>
  <div class="sdpi-wrapper" id="main">
    <div class="sdpi-heading">국내/해외 주식·매크로 (네이버페이 증권)</div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">종목 검색</div>
      <div class="sdpi-item-value">
        <input type="text" id="searchInput" placeholder="예: 삼성전자, 나스닥, 원유, 금, 국채, 환율" />
        <button id="searchBtn">검색</button>
      </div>
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">검색 결과</div>
      <div class="sdpi-item-value">
        <select id="searchResults">
          <option value="">검색 후 종목을 선택하세요</option>
        </select>
      </div>
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">종목 코드</div>
      <div class="sdpi-item-value">
        <input type="text" id="stockCode" placeholder="예: 005930, CL=F, ^TNX" maxlength="20" />
        <button id="applyCodeBtn">적용</button>
      </div>
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">데이터 소스</div>
      <div class="sdpi-item-value">
        <select id="dataSource">
          <option value="direct">직접 API (기본 · 릴레이 불필요)</option>
          <option value="auto">자동 (로컬 릴레이 우선 → 직접 API)</option>
          <option value="relay">파워쉘 릴레이 (127.0.0.1:18765)</option>
        </select>
      </div>
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">새로고침</div>
      <div class="sdpi-item-value">
        <select id="refreshInterval">
          <option value="10">10초마다 (기본)</option>
          <option value="30">30초마다</option>
          <option value="60">1분마다</option>
          <option value="300">5분마다</option>
          <option value="0">수동 (자동 갱신 안 함)</option>
        </select>
      </div>
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">클릭 시 화면</div>
      <div class="sdpi-item-value">
        <select id="urlMode">
          <option value="naverPay">네이버페이 증권 (stock.naver.com)</option>
          <option value="naverPayMobile">네이버페이 증권 모바일</option>
          <option value="naverFinance">네이버 금융 구버전 (finance.naver.com)</option>
        </select>
      </div>
    </div>

    <div class="sdpi-item">
      <div class="sdpi-item-label">표시 옵션</div>
      <div class="sdpi-item-value">
        <label class="checkbox-wrap">
          <input type="checkbox" id="showExchange" checked />
          <span>시장 구분(KOSPI/KOSDAQ/INDEX/매크로) 표시</span>
        </label>
      </div>
    </div>

    <div class="actions-row">
      <button id="refreshBtn">즉시 새로고침</button>
      <button id="openUrlBtn" class="primary">네이버페이 증권 열기</button>
    </div>

    <div class="status-text" id="statusText"></div>
  </div>
  <script src="index.js"></script>
</body>
</html>
